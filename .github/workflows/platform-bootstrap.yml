name: Platform Bootstrap

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: EKS cluster name
        required: true
        default: etechapp-eks-spj1rJJ9
      aws_region:
        description: AWS region
        required: true
        default: us-east-2

permissions:
  contents: read
  id-token: write

env:
  GHA_ROLE_ARN: arn:aws:iam::124666675812:role/github-actions-observability-eks

jobs:
  bootstrap:
    name: Install Argo CD and root apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GHA_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-observability-eks-bootstrap

      - name: Install tools
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Bootstrap platform
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh
