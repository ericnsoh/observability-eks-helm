replicaCount: 1

image:
  repository: 124666675812.dkr.ecr.us-east-2.amazonaws.com/ecommerce
  tag: "014c208"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  hosts:
    - host: ecommerce.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

env:
  COMPANY_NAME: "ExcelCloud Market"

serviceAccount:
  create: true
  name: ecommerce

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: kube-prometheus-stack

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
